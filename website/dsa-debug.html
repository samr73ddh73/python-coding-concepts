<!DOCTYPE html>
<html>
<head>
  <title>Debug Page</title>
  <style>
    body { background: #0a0e27; color: #e0e6ff; font-family: monospace; padding: 2rem; }
    pre { background: #16213e; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Debug Console</h1>
  <div id="log"></div>
  
  <script>
    const log = [];
    
    function addLog(msg) {
      log.push(msg);
      document.getElementById('log').innerHTML = log.map(l => `<div>${l}</div>`).join('');
    }
    
    addLog('<span class="success">[1]</span> Page loaded');
    addLog('<span class="success">[2]</span> Testing fetch...');
    
    // Test fetch
    fetch('all-data.json')
      .then(response => {
        addLog(`<span class="success">[3]</span> Response status: ${response.status}`);
        addLog(`<span class="success">[4]</span> Response ok: ${response.ok}`);
        return response.json();
      })
      .then(data => {
        addLog(`<span class="success">[5]</span> JSON parsed successfully`);
        addLog(`<span class="success">[6]</span> Topics found: ${Object.keys(data).length}`);
        addLog(`<span class="success">[7]</span> Topics: ${Object.keys(data).join(', ')}`);
        addLog(`<span class="success">[8]</span> Array problems: ${data.Array.problems.length}`);
        addLog(`<span class="success">[9]</span> Trees problems: ${data.Trees.problems.length}`);
        addLog(`<span class="success">[10]</span> ALL GOOD! Go to dsa-topic-dynamic.html?topic=Trees`);
      })
      .catch(error => {
        addLog(`<span class="error">[ERROR]</span> ${error.message}`);
        addLog(`<span class="error">[STACK]</span> ${error.stack}`);
      });
  </script>
</body>
</html>

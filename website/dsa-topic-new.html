    /* Mobile-First Responsive */
    * { box-sizing: border-box; }

    .topic-main { padding: 1rem; }
    @media (min-width: 768px) { .topic-main { padding: 2rem; } }

    .topic-container { max-width: 1400px; margin: 0 auto; }

    .topic-sidebar { width: 100%; margin-bottom: 2rem; }
    @media (min-width: 1024px) {
      .topic-sidebar { width: auto; position: sticky; top: 2rem; max-width: 200px; }
    }

    .sidebar-nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    @media (min-width: 1024px) {
      .sidebar-nav { display: flex; flex-direction: column; gap: 0; }
    }

    .nav-item {
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    @media (max-width: 1023px) {
      .nav-item { flex: 1; min-width: 100px; }
    }

    .nav-item.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    .nav-item:hover {
      border-color: var(--accent-blue);
    }

    .topic-content-wrapper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    @media (min-width: 1024px) {
      .topic-content-wrapper {
        grid-template-columns: 1fr 280px;
      }
    }

    .topic-sidebar-notes {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      order: 2;
    }
    @media (min-width: 1024px) {
      .topic-sidebar-notes {
        height: fit-content;
        position: sticky;
        top: 2rem;
        order: unset;
      }
    }

    .notes-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .note-item {
      padding: 0.75rem;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .note-item:hover {
      border-left-color: var(--accent-blue);
      transform: translateX(4px);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    @media (min-width: 768px) {
      .overview-grid { grid-template-columns: 1fr 1fr; }
    }

    .overview-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
    }

    .overview-card h3 {
      margin-top: 0;
      color: var(--accent-blue);
      margin-bottom: 1rem;
    }

    .overview-card ul {
      list-style: none;
      padding: 0;
    }

    .overview-card li {
      padding: 0.5rem 0;
      color: var(--text-secondary);
    }

    .pattern-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pattern-tag {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid var(--accent-blue);
    }

    .pattern-description {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--accent-blue);
      margin-bottom: 1.5rem;
    }

    .pattern-description h3 {
      margin-top: 0;
      color: var(--accent-blue);
    }

    .pattern-description p {
      margin: 0.5rem 0;
    }

    .tips-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .tips-container { grid-template-columns: 1fr 1fr; }
    }

    .tip-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .tip-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-4px);
    }

    .tip-label {
      font-size: 0.8rem;
      color: var(--accent-blue);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .tip-card h3 {
      margin: 0.5rem 0;
      font-size: 1rem;
    }

    .tip-card p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .problems-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .problems-container { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1024px) {
      .problems-container { grid-template-columns: 1fr 1fr 1fr; }
    }

    .problem-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }

    .problem-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-4px);
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .problem-header h3 {
      margin: 0;
      flex: 1;
      font-size: 1rem;
    }

    .difficulty {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .difficulty.easy { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .difficulty.medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .difficulty.hard { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    .problem-description {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .problem-meta {
      margin-bottom: 1rem;
    }

    .btn-view {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      font-weight: 500;
      width: 100%;
    }

    .btn-view:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .decision-tree {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--accent-blue);
      margin-bottom: 1.5rem;
    }

    .tree-item {
      padding: 1rem;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      margin-bottom: 0.75rem;
      border-left: 3px solid var(--accent-blue);
    }

    /* ========== MODALS ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      padding: 1rem;
      overflow-y: auto;
    }

    .modal-overlay.visible {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2rem;
    }

    @media (max-height: 600px) {
      .modal-overlay.visible {
        align-items: center;
        padding-top: 1rem;
      }
    }

    .modal {
      background: #0f1419;
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.3rem;
      flex: 1;
      word-break: break-word;
    }

    .modal-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .modal-close:hover {
      color: #fff;
      background: rgba(148, 163, 184, 0.1);
      border-radius: 4px;
    }

    .modal-body {
      overflow-y: auto;
      padding: 1.5rem;
      flex: 1;
    }

    .solution-text {
      color: #d1d5db;
      line-height: 1.7;
    }

    /* Responsive modals */
    @media (max-width: 768px) {
      .modal {
        max-height: 95vh;
        border-radius: 0;
      }

      .modal-header {
        padding: 1rem;
      }

      .modal-body {
        padding: 1rem;
      }

      .modal-header h2 {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .modal-overlay {
        padding: 0;
      }

      .modal {
        max-height: 100vh;
        border-radius: 0;
        margin: 0;
      }

      .modal-header {
        padding: 0.75rem 1rem;
      }

      .modal-body {
        padding: 0.75rem 1rem;
      }

      .modal-header h2 {
        font-size: 1rem;
      }

      .modal-close {
        font-size: 1.3rem;
      }
    }
  </style>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic - Interview Prep Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-new.css">
  <link rel="stylesheet" href="enhanced.css">
  <style>
    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #16213e;
      --text-primary: #e0e6ff;
      --text-secondary: #a0aec0;
      --border-color: #2d3748;
      --accent-blue: #0ea5e9;
      --accent-purple: #a855f7;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Geist', sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 2rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .back-button:hover {
      border-color: var(--accent-blue);
    }

    .topic-header {
      margin-bottom: 3rem;
    }

    .topic-title {
      font-size: 3rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .topic-stats {
      display: flex;
      gap: 2rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .main-content {
      order: 1;
    }

    .sidebar {
      order: 2;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    @media (max-width: 1024px) {
      .sidebar {
        position: static;
        margin-bottom: 2rem;
      }
    }

    .section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--accent-blue);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .problems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .problem-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }

    .problem-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
    }

    .problem-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .problem-file {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      font-family: 'Fira Code', monospace;
    }

    .view-button {
      margin-top: auto;
      padding: 0.75rem 1rem;
      background: var(--accent-blue);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .view-button:hover {
      background: var(--accent-purple);
    }

    .notes-section h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .note-item {
      padding: 0.75rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      font-size: 0.9rem;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item:hover {
      background: var(--bg-primary);
      border-color: var(--accent-blue);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      overflow-y: auto;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 2rem;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .code-block {
      background: #1e1e1e;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.9rem;
      font-family: 'Fira Code', monospace;
      line-height: 1.5;
    }

    .dp-category {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .dp-category-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent-purple);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      color: #fca5a5;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-button">&larr; Back to Mind Map</a>

    <div class="topic-header" id="topicHeader">
      <div class="loading">Loading topic data...</div>
    </div>

    <div class="content-grid">
      <div class="main-content" id="mainContent"></div>
      <div class="sidebar" id="sidebar"></div>
    </div>
  </div>

  <!-- Code Modal -->
  <div class="modal" id="codeModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="codeModalTitle">Code</h2>
        <button class="modal-close" onclick="closeModal('codeModal')">&times;</button>
      </div>
      <div id="codeModalBody"></div>
    </div>
  </div>

  <!-- Note Modal -->
  <div class="modal" id="noteModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="noteModalTitle">Note</h2>
        <button class="modal-close" onclick="closeModal('noteModal')">&times;</button>
      </div>
      <div id="noteModalBody"></div>
    </div>
  </div>

  <script src="md-renderer.js"></script>
  <script>
    let allData = {};
    let problemCodes = {};

    // Load data
    async function loadData() {
      try {
        console.log('Starting to load all-data.json...');
        console.log('Current location:', window.location.href);

        // Try multiple paths
        const paths = [
          'all-data.json',
          './all-data.json',
          '/all-data.json'
        ];

        let response = null;
        let lastError = null;

        for (const path of paths) {
          try {
            console.log('Trying path:', path);
            response = await fetch(path);
            if (response.ok) {
              console.log('Successfully fetched from:', path);
              break;
            }
          } catch (err) {
            lastError = err;
            console.log('Failed path:', path, err);
          }
        }

        if (!response || !response.ok) {
          throw new Error(`Failed to fetch all-data.json from any path. Last error: ${lastError?.message}`);
        }

        const text = await response.text();
        console.log('Response text length:', text.length);

        allData = JSON.parse(text);
        console.log('JSON parsed successfully. Topics:', Object.keys(allData).join(', '));

        renderTopic();
      } catch (error) {
        console.error('Error loading data:', error);
        console.error('Error message:', error.message);
        document.getElementById('topicHeader').innerHTML = '<div class="error">Error loading data: ' + error.message + '. Check console (F12) or ensure all-data.json exists.</div>';
      }
    }

    // Get topic from URL
    function getTopicFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('topic') || 'Array';
    }

    // Render topic
    function renderTopic() {
      problemCodes = {};  // Clear previous codes
      const topicName = getTopicFromURL();
      const topicData = allData[topicName];

      if (!topicData) {
        document.getElementById('topicHeader').innerHTML = `<div class="error">Topic "${topicName}" not found</div>`;
        return;
      }

      // Header
      const problems = topicData.problems || [];
      const notes = topicData.notes || [];
      const displayName = topicData.displayName || topicName;
      const headerHTML = `
        <h1 class="topic-title">${displayName}</h1>
        <div class="topic-stats">
          <div class="stat">
            <span class="stat-number">${problems.length}</span>
            <span class="stat-label">Problems</span>
          </div>
          <div class="stat">
            <span class="stat-number">${notes.length}</span>
            <span class="stat-label">Notes</span>
          </div>
        </div>
      `;
      document.getElementById('topicHeader').innerHTML = headerHTML;

      // Main content
      let mainHTML = '';

      // Problems section
      mainHTML += '<div class="section">';
      mainHTML += '<h2 class="section-title">🧩 Problems</h2>';

      // Special handling for DP
      if (topicName === 'DP' && topicData.categories) {
        mainHTML += '<div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Core DP Problems</div>';
        mainHTML += renderProblems(problems);

        for (const [categoryName, categoryData] of Object.entries(topicData.categories)) {
          mainHTML += '<div class="dp-category">';
          mainHTML += `<h3 class="dp-category-title">${categoryName}</h3>`;
          mainHTML += renderProblems(categoryData.problems || []);
          mainHTML += '</div>';
        }
      } else {
        mainHTML += renderProblems(problems);
      }
      mainHTML += '</div>';

      document.getElementById('mainContent').innerHTML = mainHTML;

      // Sidebar with notes
      let sidebarHTML = '<div class="notes-section"><h3>Notes & Guides</h3>';
      if (notes.length > 0) {
        notes.forEach((note, idx) => {
          const noteId = 'note_' + Date.now() + '_' + idx;
          problemCodes[noteId] = { topic: topicName, name: note.name, content: note.content };
          sidebarHTML += `<div class="note-item" onclick="openNoteModal('${noteId}')">${escapeHtml(note.name)}</div>`;
        });
      } else {
        sidebarHTML += '<div style="color: var(--text-secondary); font-size: 0.9rem;">No notes available</div>';
      }
      sidebarHTML += '</div>';
      document.getElementById('sidebar').innerHTML = sidebarHTML;
    }

    // Render problems grid
    function renderProblems(problems) {
      if (problems.length === 0) {
        return '<div style="color: var(--text-secondary);">No problems found</div>';
      }

      let html = '<div class="problems-grid">';
      problems.forEach((problem, idx) => {
        const displayName = problem.name || problem.filename;
        const codeId = 'code_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        problemCodes[codeId] = problem.code;

        html += `
          <div class="problem-card">
            <div class="problem-name">${escapeHtml(displayName)}</div>
            <div class="problem-file">${escapeHtml(problem.filename)}</div>
            <button class="view-button" onclick="openCodeModal('${escapeHtml(displayName)}', '${codeId}')">View Code</button>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    // Open code modal
    function openCodeModal(name, codeId) {
      document.getElementById('codeModalTitle').textContent = name;
      const code = problemCodes[codeId] || 'Code not found';
      const codeBlock = `<pre class="code-block"><code>${escapeHtml(code)}</code></pre>`;
      document.getElementById('codeModalBody').innerHTML = codeBlock;
      document.getElementById('codeModal').classList.add('active');
    }

    // Open note modal
    function openNoteModal(noteId) {
      const noteData = problemCodes[noteId];
      if (!noteData || !noteData.content) {
        console.error('Note not found:', noteId);
        return;
      }

      document.getElementById('noteModalTitle').textContent = noteData.name;
      const renderedHTML = window.markdownToHTML ? window.markdownToHTML(noteData.content) : `<pre>${escapeHtml(noteData.content)}</pre>`;
      document.getElementById('noteModalBody').innerHTML = renderedHTML;
      document.getElementById('noteModal').classList.add('active');
    }

    // Close modal
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Escape key closes modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('codeModal').classList.remove('active');
        document.getElementById('noteModal').classList.remove('active');
      }
    });

    // Click outside modal closes it
    document.getElementById('codeModal').addEventListener('click', (e) => {
      if (e.target.id === 'codeModal') closeModal('codeModal');
    });

    document.getElementById('noteModal').addEventListener('click', (e) => {
      if (e.target.id === 'noteModal') closeModal('noteModal');
    });

    // Helper to escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load on page load
    window.addEventListener('load', loadData);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Complete Hub - All Notes & Practice</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --dark-bg: #0a0e27;
            --card-bg: #1a1f3a;
            --light-text: #e0e7ff;
            --muted-text: #a5b4fc;
            --border: #312e81;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg), #1a0033);
            color: var(--light-text);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 200px);
        }

        .sidebar {
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 2rem 0;
        }

        .topic-btn {
            display: block;
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--light-text);
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-weight: 500;
        }

        .topic-btn:hover, .topic-btn.active {
            background: rgba(102, 126, 234, 0.2);
            border-left-color: var(--primary);
            color: var(--accent);
        }

        .main {
            padding: 2rem;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(26, 31, 58, 0.3));
            display: flex;
            flex-direction: column;
        }

        .content {
            overflow-y: auto;
            flex: 1;
        }

        .section-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

        .section-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .section-btn:hover, .section-btn.active {
            background: var(--primary);
            color: white;
        }

        .content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Markdown Rendering */
        .markdown {
            line-height: 1.8;
        }

        .markdown h1 {
            font-size: 2.5rem;
            margin: 2rem 0 1rem 0;
            color: var(--accent);
        }

        .markdown h2 {
            font-size: 1.8rem;
            margin: 1.5rem 0 0.8rem 0;
            color: var(--primary);
        }

        .markdown h3 {
            font-size: 1.4rem;
            margin: 1.2rem 0 0.6rem 0;
            color: var(--primary);
        }

        .markdown h4, .markdown h5, .markdown h6 {
            margin: 1rem 0 0.5rem 0;
        }

        .markdown p {
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .markdown code {
            background: rgba(102, 126, 234, 0.2);
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .markdown pre {
            background: #0d0a1f;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .markdown pre code {
            background: none;
            color: #58d9ff;
            padding: 0;
        }

        .markdown table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .markdown th {
            background: rgba(102, 126, 234, 0.2);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .markdown td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .markdown tr:last-child td {
            border-bottom: none;
        }

        .markdown ul, .markdown ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        .markdown li {
            margin-bottom: 0.5rem;
        }

        .markdown blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--muted-text);
            font-style: italic;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }

        /* Questions List */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .question-card h4 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .question-card p {
            font-size: 0.9rem;
            color: var(--muted-text);
            margin-bottom: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
        }

        .badge-easy { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-medium { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-hard { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--muted-text);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                padding: 1rem;
                overflow-x: auto;
                border-bottom: 1px solid var(--border);
                border-right: none;
            }
            .topic-btn {
                padding: 0.6rem 1rem;
                white-space: nowrap;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            .main {
                padding: 1rem;
            }
            .markdown h1 { font-size: 1.8rem; }
            .markdown h2 { font-size: 1.4rem; }
            .markdown h3 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>📚 DSA Complete Hub</h1>
        <p>Learn from your notes, master patterns, practice problems</p>
    </header>

    <div class="layout">
        <!-- SIDEBAR -->
        <div class="sidebar" id="topicList"></div>

        <!-- MAIN -->
        <div class="main">
            <div class="section-header">
                <button class="section-btn active" data-section="theory">📖 Theory</button>
                <button class="section-btn" data-section="patterns">🎯 Patterns</button>
                <button class="section-btn" data-section="code">💻 Code</button>
                <button class="section-btn" data-section="questions">❓ Questions</button>
                <button class="section-btn" data-section="tricks">⚡ Tricks</button>
                <button class="section-btn" data-section="flashcards">🎓 Flashcards</button>
            </div>

            <div id="theory" class="content active">
                <div class="loading"><div class="spinner"></div>Loading theory...</div>
            </div>
            <div id="patterns" class="content">
                <div class="loading"><div class="spinner"></div>Loading patterns...</div>
            </div>
            <div id="code" class="content">
                <div class="loading"><div class="spinner"></div>Loading code files...</div>
            </div>
            <div id="questions" class="content">
                <div class="loading"><div class="spinner"></div>Loading questions...</div>
            </div>
            <div id="tricks" class="content">
                <div class="loading"><div class="spinner"></div>Loading tricks...</div>
            </div>
            <div id="flashcards" class="content">
                <div class="loading"><div class="spinner"></div>Loading flashcards...</div>
            </div>
        </div>
    </div>

    <script src="notes-data.js"></script>
    <script src="code-data.js"></script>

    <script>
        // Get all topics from both NOTES_DATA and CODE_DATA
        function getAllTopics() {
            const topics = new Set();

            if (typeof NOTES_DATA !== 'undefined') {
                Object.keys(NOTES_DATA).forEach(t => topics.add(t));
            }

            if (typeof CODE_DATA !== 'undefined') {
                Object.keys(CODE_DATA).forEach(t => topics.add(t));
            }

            // Sort: group by parent topic first, then alphabetically
            const sorted = Array.from(topics).sort((a, b) => {
                // Put ">" topics (subtopics) after their parent
                const aHasParent = a.includes(' > ');
                const bHasParent = b.includes(' > ');
                const aParent = aHasParent ? a.split(' > ')[0] : a;
                const bParent = bHasParent ? b.split(' > ')[0] : b;

                if (aParent !== bParent) {
                    return aParent.localeCompare(bParent);
                }
                return a.localeCompare(b);
            });

            return sorted;
        }

        // Fallback data for questions if not in NOTES_DATA
        const FALLBACK_QUESTIONS = {
            'Fundamentals': 'Master Python basics and DSA fundamentals',
            'Arrays': 'Easy: Two Sum | Medium: Container With Water | Hard: Trapping Rain Water',
            'Binary Search': 'LC 704, 35, 33, 162, 875',
            'Linked Lists': 'LC 206, 21, 141, 148, 23',
            'Trees': 'LC 104, 100, 102, 236, 124',
            'Graphs': 'LC 200, 207, 127, 1976, 1192',
            'Dynamic Programming': 'LC 1, 322, 300, 1143, 97',
            'Backtracking': 'LC 46, 47, 78, 90, 51',
            'Strings': 'LC 3, 6, 10, 44, 76',
        };

        // Get markdown content from NOTES_DATA
        function loadContent(sectionKey, topic) {
            if (typeof NOTES_DATA === 'undefined' || !NOTES_DATA[topic]) {
                return `# ${topic}\n\nNo notes found. Run: python website/build_notes.py`;
            }

            const content = NOTES_DATA[topic][sectionKey];
            if (!content) {
                return `# ${topic} - ${sectionKey}\n\nNo content available for this section.`;
            }
            return content;
        }

        // Initialize
        function init() {
            // Create topic list from all available topics
            const topicList = document.getElementById('topicList');
            const allTopics = getAllTopics();

            allTopics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'topic-btn';

                // Add indentation for subtopics (topics with " > ")
                if (topic.includes(' > ')) {
                    btn.style.paddingLeft = '3rem';
                    btn.style.fontSize = '0.9rem';
                    btn.style.opacity = '0.85';
                    // Extract just the subtopic name
                    const displayName = topic.split(' > ')[1];
                    btn.textContent = '└─ ' + displayName;
                } else {
                    btn.textContent = topic;
                    btn.style.fontWeight = '600';
                }

                btn.onclick = () => selectTopic(topic, btn);
                topicList.appendChild(btn);
            });

            // Section buttons
            document.querySelectorAll('[data-section]').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    const section = btn.dataset.section;
                    document.getElementById(section).classList.add('active');

                    // Load content
                    if (section === 'theory') loadTheory(window.currentTopic);
                    else if (section === 'patterns') loadPatterns(window.currentTopic);
                    else if (section === 'code') loadCode(window.currentTopic);
                    else if (section === 'questions') loadQuestions(window.currentTopic);
                    else if (section === 'tricks') loadTricks(window.currentTopic);
                    else if (section === 'flashcards') loadFlashcards(window.currentTopic);
                };
            });

            // Select first topic
            const firstTopic = allTopics[0];
            if (firstTopic && topicList.firstChild) {
                selectTopic(firstTopic, topicList.firstChild);
            }
        }

        function selectTopic(topic, btn) {
            window.currentTopic = topic;
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            // Load theory by default
            loadTheory(topic);
        }

        function loadTheory(topic) {
            const content = document.getElementById('theory');
            const markdown = loadContent('theory', topic);
            content.innerHTML = `<div class="markdown">${marked.parse(markdown)}</div>`;
        }

        function loadPatterns(topic) {
            const content = document.getElementById('patterns');
            const markdown = loadContent('patterns', topic);
            content.innerHTML = `<div class="markdown">${marked.parse(markdown)}</div>`;
        }

        function loadCode(topic) {
            const content = document.getElementById('code');

            if (typeof CODE_DATA === 'undefined' || !CODE_DATA[topic] || CODE_DATA[topic].length === 0) {
                content.innerHTML = `
                    <div style="padding: 2rem; text-align: center; color: var(--muted-text);">
                        <h3>No code files found for ${topic}</h3>
                        <p>Code files from this topic will appear here after building.</p>
                    </div>
                `;
                return;
            }

            const files = CODE_DATA[topic];
            const html = `
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
                    ${files.map((file, i) => `
                        <div class="code-card" onclick="viewCode('${topic}', ${i})" style="
                            cursor: pointer;
                            background: var(--card-bg);
                            border: 1px solid var(--border);
                            border-radius: 8px;
                            padding: 1.5rem;
                            transition: all 0.3s ease;
                        ">
                            <h4 style="color: var(--accent); margin: 0 0 0.5rem 0;">${file.filename}</h4>
                            <p style="color: var(--muted-text); font-size: 0.85rem; margin: 0.5rem 0;">
                                📂 ${file.path}
                            </p>
                            ${file.docstring ? `
                                <p style="color: var(--light-text); font-size: 0.9rem; margin: 0.5rem 0; border-left: 2px solid var(--primary); padding-left: 0.5rem;">
                                    ${file.docstring.substring(0, 100)}...
                                </p>
                            ` : ''}
                            <p style="color: var(--success); font-size: 0.85rem; margin-top: 1rem;">→ Click to view full code</p>
                        </div>
                    `).join('')}
                </div>
            `;
            content.innerHTML = html;
        }

        function viewCode(topic, fileIndex) {
            if (!CODE_DATA[topic] || !CODE_DATA[topic][fileIndex]) return;

            const file = CODE_DATA[topic][fileIndex];
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                padding: 1rem;
            `;

            modal.innerHTML = `
                <div style="
                    background: var(--card-bg);
                    border-radius: 12px;
                    max-width: 900px;
                    width: 100%;
                    max-height: 80vh;
                    overflow-y: auto;
                    padding: 2rem;
                ">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <div>
                            <h2 style="margin: 0; color: var(--accent);">${file.filename}</h2>
                            <p style="margin: 0.5rem 0 0 0; color: var(--muted-text); font-size: 0.9rem;">📂 ${file.path}</p>
                        </div>
                        <button onclick="this.closest('div').parentElement.parentElement.remove()" style="
                            background: var(--danger);
                            color: white;
                            border: none;
                            padding: 0.5rem 1rem;
                            border-radius: 6px;
                            cursor: pointer;
                            font-weight: bold;
                        ">✕ Close</button>
                    </div>

                    ${file.docstring ? `
                        <div style="
                            background: rgba(102, 126, 234, 0.1);
                            border-left: 3px solid var(--primary);
                            padding: 1rem;
                            margin-bottom: 1rem;
                            border-radius: 6px;
                        ">
                            <p style="margin: 0; color: var(--light-text); white-space: pre-wrap; font-size: 0.9rem;">
                                ${file.docstring}
                            </p>
                        </div>
                    ` : ''}

                    <pre style="
                        background: #0a0e27;
                        border-radius: 8px;
                        padding: 1rem;
                        overflow-x: auto;
                        color: #a5b4fc;
                        font-family: 'Courier New', monospace;
                        font-size: 0.85rem;
                        border: 1px solid var(--border);
                    "><code>${escapeHtml(file.full_code)}</code></pre>
                </div>
            `;

            modal.onclick = (e) => {
                if (e.target === modal) modal.remove();
            };

            document.body.appendChild(modal);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function loadQuestions(topic) {
            const content = document.getElementById('questions');
            let markdown = loadContent('questions', topic);

            // If no questions content, show fallback or instruction
            if (markdown.includes('No content available')) {
                const fallback = FALLBACK_QUESTIONS[topic] || 'No questions added yet';
                markdown = `# ${topic} - Practice Questions

## Recommended Problems

${fallback}

---

To add more problems, create \`questions.md\` in \`topics/${topic.toLowerCase().replace(/\\s+/g, '-')}/\` with:

\`\`\`markdown
# [Topic] Practice Questions

## Easy
- LC 1: Problem Name - approach

## Medium
- LC 2: Problem Name - approach

## Hard
- LC 3: Problem Name - approach
\`\`\`

Then run: \`python website/build_notes.py\`
`;
            }

            content.innerHTML = `<div class="markdown">${marked.parse(markdown)}</div>`;
        }

        function loadTricks(topic) {
            const content = document.getElementById('tricks');
            let markdown = loadContent('tricks', topic);

            // If no tricks content, show helpful message
            if (markdown.includes('No content available')) {
                markdown = `
# ${topic} - Tricks & Gotchas

Create \`tricks.md\` in \`topics/${topic.toLowerCase()}/\` to add trick questions and common gotchas.

## Format for tricks.md:

\`\`\`markdown
## Trick 1: [Name]
**Trap:** What goes wrong
**Solution:** How to fix it
**Example:** Code example

---

## Trick 2: [Name]
...
\`\`\`

## To Add Tricks:
1. Run: \`python website/build_notes.py\` after adding tricks.md
2. Tricks will appear here automatically
`;
            }
            content.innerHTML = `<div class="markdown">${marked.parse(markdown)}</div>`;
        }

        function loadFlashcards(topic) {
            const content = document.getElementById('flashcards');

            // Build flashcards from patterns and theory
            const cards = [];

            // Add pattern-based flashcards
            const patterns = loadContent('patterns', topic);
            if (patterns && !patterns.includes('No content available')) {
                const headings = patterns.match(/## (.+)/g) || [];
                headings.forEach(h => {
                    const pattern = h.replace('## ', '').trim();
                    cards.push({
                        front: pattern,
                        back: 'Review pattern in notes above →'
                    });
                });
            }

            // Add theory-based flashcards
            const theory = loadContent('theory', topic);
            if (theory && !theory.includes('No content available')) {
                // Extract key complexity points if available
                if (theory.includes('|') && theory.includes('O(')) {
                    cards.push({
                        front: `${topic} - Time Complexity`,
                        back: 'Check theory section for detailed complexity analysis'
                    });
                }
            }

            // Add default cards if none found
            if (cards.length === 0) {
                cards.push(
                    { front: `${topic} - Key Concept`, back: 'Add patterns.md to see flashcards' },
                    { front: 'Time Complexity', back: 'Check theory.md for complexity analysis' },
                    { front: 'When to Use', back: 'Review patterns section' }
                );
            }

            const cardId = `flashcards-${Math.random().toString(36).substr(2, 9)}`;
            const html = `
                <style>
                    .flashcard-container {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                        gap: 1.5rem;
                        padding: 1rem;
                        max-height: 70vh;
                        overflow-y: auto;
                    }

                    .flashcard-item {
                        cursor: pointer;
                        background: linear-gradient(135deg, var(--primary), var(--secondary));
                        border-radius: 12px;
                        padding: 2rem;
                        min-height: 240px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        text-align: center;
                        color: white;
                        transition: all 0.4s ease;
                        perspective: 1000px;
                        position: relative;
                    }

                    .flashcard-item:hover {
                        transform: translateY(-5px);
                        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
                    }

                    .flashcard-item.flipped {
                        background: linear-gradient(135deg, var(--accent), var(--primary));
                    }

                    .flashcard-inner {
                        width: 100%;
                        height: 100%;
                        position: relative;
                        transition: transform 0.4s;
                        transform-style: preserve-3d;
                    }

                    .flashcard-item.flipped .flashcard-inner {
                        transform: rotateY(180deg);
                    }

                    .flashcard-front, .flashcard-back {
                        position: absolute;
                        width: 100%;
                        height: 100%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                        backface-visibility: hidden;
                    }

                    .flashcard-back {
                        transform: rotateY(180deg);
                    }

                    .flashcard-front h3 {
                        margin: 0;
                        font-size: 1.3rem;
                        line-height: 1.4;
                    }

                    .flashcard-front p {
                        margin-top: 1rem;
                        font-size: 0.85rem;
                        opacity: 0.8;
                    }

                    .flashcard-back p {
                        margin: 0;
                        font-size: 1rem;
                        line-height: 1.5;
                    }
                </style>

                <div class="flashcard-container">
                    ${cards.map((card, i) => `
                        <div class="flashcard-item" onclick="this.classList.toggle('flipped')">
                            <div class="flashcard-inner">
                                <div class="flashcard-front">
                                    <h3>${escapeHtml(card.front)}</h3>
                                    <p>👆 Click to flip</p>
                                </div>
                                <div class="flashcard-back">
                                    <p>${escapeHtml(card.back)}</p>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div style="margin-top: 1rem; padding: 1rem; background: rgba(102, 126, 234, 0.1); border-radius: 8px; text-align: center;">
                    <p style="margin: 0; font-size: 0.9rem; color: var(--muted-text);">
                        ✨ ${cards.length} cards • Click any card to flip • Scroll for more
                    </p>
                </div>
            `;
            content.innerHTML = html;
        }

        // Init on load
        init();
    </script>
</body>
</html>
